<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estoque da cervejaria</title>
<style>
:root {
  color-scheme: light dark;
  --bg:#EDF0EA; --surface:#FAFBF8; --ink:#1E2A22; --muted:#5A675E; --line:#D3DAD0;
  --hop:#2F5D3A; --hop-ink:#FFFFFF; --amber:#9A6212; --low:#B23A2B; --ok:#3F7A4C; --track:#DDE3D9;
  --serif: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#131915; --surface:#1B231E; --ink:#E6ECE3; --muted:#9AA89E; --line:#2C372F;
    --hop:#6BAA7B; --hop-ink:#0F1A12; --amber:#E0A94E; --low:#EE8A79; --ok:#6BAA7B; --track:#2A342D;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 32px 20px 64px; }

header h1 { font: 600 clamp(28px, 5vw, 44px)/1.15 var(--serif); margin: 0 0 6px; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--muted); }
header p.alerta { color: var(--low); font-weight: 600; }

.tabs { display: flex; gap: 4px; margin: 28px 0 20px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 16px; font: inherit;
  color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--hop); font-weight: 600; }

.barra { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.barra label.chk { display: flex; align-items: center; gap: 8px; color: var(--muted); }

button, input, select { font: inherit; color: inherit; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.btn:hover { border-color: var(--hop); }
.btn.primario { background: var(--hop); color: var(--hop-ink); border-color: var(--hop); font-weight: 600; }
.btn.perigo { color: var(--low); }
.btn.mini { padding: 4px 10px; font-size: 14px; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

.painel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.rolagem { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-weight: 600; color: var(--muted); font-size: 14px; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
td.acoes { white-space: nowrap; text-align: right; }
td.acoes .btn + .btn { margin-left: 6px; }
td .sub { display: block; font-size: 14px; color: var(--muted); }
td.vazio { text-align: center; color: var(--muted); padding: 36px 14px; }

/* o elemento de destaque: medidor de nível de estoque, com marcador no mínimo */
.nivel { min-width: 170px; }
.trilho { position: relative; height: 10px; background: var(--track); border-radius: 5px; }
.enchimento { height: 100%; border-radius: 5px; background: var(--ok); }
.baixo .enchimento { background: var(--low); }
.marca { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .55; left: 50%; }
.nivel small { display: block; margin-top: 6px; color: var(--muted); }
.baixo .nivel small { color: var(--low); font-weight: 600; }

.entrada { color: var(--ok); font-weight: 600; }
.saida { color: var(--amber); font-weight: 600; }

form.linha { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; padding: 18px; align-items: end; margin-bottom: 20px; }
.campo { display: flex; flex-direction: column; gap: 4px; }
.campo span { font-size: 14px; color: var(--muted); }
input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
h2 { font: 600 20px/1.3 var(--serif); margin: 0 0 12px; }

dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 0; width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(10, 15, 12, .55); }
dialog form { padding: 22px; display: grid; gap: 14px; }
dialog .rodape { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
.erro-form { color: var(--low); margin: 0; font-size: 15px; }
.erro-form:empty { display: none; }

#aviso { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; max-width: min(520px, 92vw); transition: opacity .2s, transform .2s; z-index: 10; }
#aviso.ativo { opacity: 1; transform: translate(-50%, 0); }
#aviso.erro { background: var(--low); color: #fff; }
@media (prefers-reduced-motion: reduce) { #aviso { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Estoque da cervejaria</h1>
    <p id="resumo">Carregando…</p>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-insumos" aria-selected="true" aria-controls="p-insumos">Insumos</button>
    <button role="tab" id="t-movs" aria-selected="false" aria-controls="p-movs">Entradas e saídas</button>
  </div>

  <section id="p-insumos" role="tabpanel" aria-labelledby="t-insumos">
    <div class="barra">
      <label class="chk"><input type="checkbox" id="soBaixo" style="width:auto"> Mostrar só os abaixo do mínimo</label>
      <button class="btn primario" id="novoInsumo">Novo insumo</button>
    </div>
    <div class="painel rolagem">
      <table>
        <thead><tr><th>Insumo</th><th>Saldo</th><th>Nível</th><th>Mínimo</th><th></th></tr></thead>
        <tbody id="tbInsumos"></tbody>
      </table>
    </div>
  </section>

  <section id="p-movs" role="tabpanel" aria-labelledby="t-movs" hidden>
    <h2>Registrar movimentação</h2>
    <form class="painel linha" id="formMov">
      <label class="campo"><span>Insumo</span><select name="insumoId" id="selInsumo" required></select></label>
      <label class="campo"><span>Tipo</span>
        <select name="tipo"><option value="ENTRADA">Entrada</option><option value="SAIDA">Saída</option></select></label>
      <label class="campo"><span>Quantidade</span><input name="quantidade" type="number" step="any" min="0" required></label>
      <label class="campo"><span>Observação</span><input name="observacao" maxlength="255" placeholder="Ex.: Brassagem IPA #3"></label>
      <button class="btn primario" type="submit">Registrar movimentação</button>
    </form>

    <h2>Histórico</h2>
    <div class="painel rolagem">
      <table>
        <thead><tr><th>Data</th><th>Insumo</th><th>Tipo</th><th>Quantidade</th><th>Observação</th><th></th></tr></thead>
        <tbody id="tbMovs"></tbody>
      </table>
    </div>
  </section>
</div>

<dialog id="dlg">
  <form id="formInsumo">
    <h2 id="dlgTitulo">Novo insumo</h2>
    <input type="hidden" name="id">
    <label class="campo"><span>Nome</span><input name="nome" required maxlength="120"></label>
    <label class="campo"><span>Tipo</span>
      <select name="tipo">
        <option value="MALTE">Malte</option><option value="LUPULO">Lúpulo</option><option value="LEVEDURA">Levedura</option>
        <option value="ADJUNTO">Adjunto</option><option value="OUTRO">Outro</option>
      </select></label>
    <label class="campo"><span>Unidade (kg, g, pacote…)</span><input name="unidade" required maxlength="20"></label>
    <label class="campo"><span>Estoque mínimo</span><input name="estoqueMinimo" type="number" step="any" min="0" required></label>
    <p class="erro-form" id="erroDlg" role="alert"></p>
    <div class="rodape">
      <button type="button" class="btn" id="cancelar">Cancelar</button>
      <button type="submit" class="btn primario">Salvar insumo</button>
    </div>
  </form>
</dialog>

<div id="aviso" role="status" aria-live="polite"></div>

<script>
const $ = (s) => document.querySelector(s);
const fmt = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 3 });
const TIPOS = { MALTE: 'Malte', LUPULO: 'Lúpulo', LEVEDURA: 'Levedura', ADJUNTO: 'Adjunto', OUTRO: 'Outro' };
const state = { insumos: [], movs: [] };

// Cria elementos com textContent, nunca innerHTML (evita injeção de HTML pelos dados)
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach((c) => e.append(c instanceof Node ? c : document.createTextNode(c ?? '')));
  return e;
}

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 204) return null;
  const body = await res.json().catch(() => null);
  if (!res.ok) {
    const campos = body && body.campos ? Object.entries(body.campos).map(([k, v]) => `${k} ${v}`).join('; ') : '';
    throw new Error(((body && body.mensagem) || `Erro ${res.status}`) + (campos ? `: ${campos}` : ''));
  }
  return body;
}

let timer;
function aviso(msg, erro = false) {
  const el = $('#aviso');
  el.textContent = msg;
  el.className = 'ativo' + (erro ? ' erro' : '');
  clearTimeout(timer);
  timer = setTimeout(() => (el.className = ''), erro ? 6000 : 2800);
}

async function carregar() {
  try {
    [state.insumos, state.movs] = await Promise.all([api('/insumos'), api('/movimentacoes')]);
    render();
  } catch (e) {
    $('#resumo').textContent = 'Não foi possível falar com a API. Ela está rodando?';
    aviso(e.message, true);
  }
}

function render() {
  const baixos = state.insumos.filter((i) => i.abaixoDoMinimo).length;
  const r = $('#resumo');
  r.className = baixos ? 'alerta' : '';
  r.textContent = !state.insumos.length ? 'Nenhum insumo cadastrado ainda.'
    : baixos ? `${baixos} ${baixos === 1 ? 'insumo está abaixo' : 'insumos estão abaixo'} do mínimo.`
    : `Tudo em dia: ${state.insumos.length} ${state.insumos.length === 1 ? 'insumo' : 'insumos'} acima do mínimo.`;
  renderInsumos();
  renderMovs();
  const sel = $('#selInsumo'), atual = sel.value;
  sel.replaceChildren(...state.insumos.map((i) => h('option', { value: i.id }, `${i.nome} (${fmt.format(i.quantidadeAtual)} ${i.unidade})`)));
  if (atual) sel.value = atual;
}

function medidor(i) {
  const escala = i.estoqueMinimo > 0 ? i.estoqueMinimo * 2 : Math.max(i.quantidadeAtual, 1);
  const pct = Math.min(100, (i.quantidadeAtual / escala) * 100);
  return h('div', { class: 'nivel' },
    h('div', { class: 'trilho' },
      h('div', { class: 'enchimento', style: `width:${pct}%` }),
      i.estoqueMinimo > 0 ? h('div', { class: 'marca', title: 'Estoque mínimo' }) : null),
    h('small', {}, i.abaixoDoMinimo ? 'Abaixo do mínimo' : 'Em dia'));
}

function renderInsumos() {
  const lista = state.insumos.filter((i) => !$('#soBaixo').checked || i.abaixoDoMinimo);
  const corpo = $('#tbInsumos');
  corpo.replaceChildren();
  if (!lista.length) {
    corpo.append(h('tr', {}, h('td', { colspan: 5, class: 'vazio' },
      state.insumos.length ? 'Nenhum insumo abaixo do mínimo.' : 'Nenhum insumo cadastrado. Clique em "Novo insumo" para começar.')));
    return;
  }
  lista.forEach((i) => corpo.append(h('tr', { class: i.abaixoDoMinimo ? 'baixo' : '' },
    h('td', {}, h('strong', {}, i.nome), h('span', { class: 'sub' }, TIPOS[i.tipo] || i.tipo)),
    h('td', { class: 'num' }, `${fmt.format(i.quantidadeAtual)} ${i.unidade}`),
    h('td', {}, medidor(i)),
    h('td', { class: 'num' }, `${fmt.format(i.estoqueMinimo)} ${i.unidade}`),
    h('td', { class: 'acoes' },
      h('button', { class: 'btn mini', onclick: () => abrirDialogo(i) }, 'Editar'),
      h('button', { class: 'btn mini perigo', onclick: () => excluir(i) }, 'Excluir')))));
}

function renderMovs() {
  const corpo = $('#tbMovs');
  corpo.replaceChildren();
  if (!state.movs.length) {
    corpo.append(h('tr', {}, h('td', { colspan: 6, class: 'vazio' }, 'Nenhuma movimentação registrada ainda.')));
    return;
  }
  state.movs.forEach((m) => {
    const entrada = m.tipo === 'ENTRADA';
    corpo.append(h('tr', {},
      h('td', { class: 'num' }, new Date(m.data).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })),
      h('td', {}, m.insumoNome),
      h('td', { class: entrada ? 'entrada' : 'saida' }, entrada ? 'Entrada' : 'Saída'),
      h('td', { class: 'num' }, `${entrada ? '+' : '−'}${fmt.format(m.quantidade)}`),
      h('td', {}, m.observacao || ''),
      h('td', { class: 'acoes' }, h('button', { class: 'btn mini perigo', onclick: () => estornar(m) }, 'Estornar'))));
  });
}

// ---------- insumos ----------
function abrirDialogo(i) {
  const f = $('#formInsumo');
  f.reset();
  $('#erroDlg').textContent = '';
  $('#dlgTitulo').textContent = i ? 'Editar insumo' : 'Novo insumo';
  f.id.value = i ? i.id : '';
  if (i) { f.nome.value = i.nome; f.tipo.value = i.tipo; f.unidade.value = i.unidade; f.estoqueMinimo.value = i.estoqueMinimo; }
  $('#dlg').showModal();
  f.nome.focus();
}

$('#novoInsumo').addEventListener('click', () => abrirDialogo(null));
$('#cancelar').addEventListener('click', () => $('#dlg').close());

$('#formInsumo').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, id = f.id.value;
  const corpo = { nome: f.nome.value, tipo: f.tipo.value, unidade: f.unidade.value, estoqueMinimo: Number(f.estoqueMinimo.value) };
  try {
    await api(id ? `/insumos/${id}` : '/insumos', { method: id ? 'PUT' : 'POST', body: JSON.stringify(corpo) });
    $('#dlg').close();
    aviso(id ? 'Insumo atualizado.' : 'Insumo criado.');
    await carregar();
  } catch (err) {
    $('#erroDlg').textContent = err.message;
  }
});

async function excluir(i) {
  if (!confirm(`Excluir o insumo "${i.nome}"?`)) return;
  try { await api(`/insumos/${i.id}`, { method: 'DELETE' }); aviso('Insumo excluído.'); await carregar(); }
  catch (err) { aviso(err.message, true); }
}

// ---------- movimentações ----------
$('#formMov').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const corpo = { insumoId: Number(f.insumoId.value), tipo: f.tipo.value, quantidade: Number(f.quantidade.value), observacao: f.observacao.value || null };
  try {
    await api('/movimentacoes', { method: 'POST', body: JSON.stringify(corpo) });
    aviso('Movimentação registrada.');
    f.quantidade.value = ''; f.observacao.value = '';
    await carregar();
  } catch (err) { aviso(err.message, true); }
});

async function estornar(m) {
  if (!confirm(`Estornar ${m.tipo === 'ENTRADA' ? 'a entrada' : 'a saída'} de ${fmt.format(m.quantidade)} em "${m.insumoNome}"?`)) return;
  try { await api(`/movimentacoes/${m.id}`, { method: 'DELETE' }); aviso('Movimentação estornada.'); await carregar(); }
  catch (err) { aviso(err.message, true); }
}

// ---------- abas e filtro ----------
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach((x) => {
    const ativa = x === b;
    x.setAttribute('aria-selected', ativa);
    $('#' + x.getAttribute('aria-controls')).hidden = !ativa;
  });
}));
$('#soBaixo').addEventListener('change', renderInsumos);

carregar();
</script>
</body>
</html>
