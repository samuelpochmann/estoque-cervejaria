services:
  db:
    image: postgres:16-alpine
    container_name: cervejaria-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cervejaria}
      POSTGRES_USER: ${DB_USER:-cerveja}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cerveja123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: cervejaria-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-cervejaria}
      DB_USER: ${DB_USER:-cerveja}
      DB_PASSWORD: ${DB_PASSWORD:-cerveja123}
    ports:
      - "8080:8080"

volumes:
  pgdata:
